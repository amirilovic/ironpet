name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste tokens, chat contents, or anything from `~/.ironpet` you wouldn't want public.
        Security problems: use **Report a vulnerability** on the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the chat with ⌥⌘G
        2. ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pet / speech bubbles
        - Chat
        - Agent watching (Cursor / Claude Code hooks)
        - Approvals (Allow / Deny)
        - Settings / config.json
        - Welcome window / install / uninstall
        - Reminders
        - GitHub / Sentry alerts
        - Other
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agent CLIs and versions
      description: Output of `cursor-agent --version` and/or `claude --version`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Quit ironpet, run `/Applications/IronPet.app/Contents/MacOS/IronPet` in Terminal, reproduce the problem,
        and paste the lines starting with `ironpet:`. Build problems: attach `build/install.log`.
      render: text
