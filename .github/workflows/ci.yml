name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Bundle the app (ad-hoc signed, includes the generated sprite sheet)
        run: |
          ./scripts/bundle.sh
          test -f build/IronPet.app/Contents/Resources/spritesheet.png
          codesign --verify --verbose build/IronPet.app
          ./scripts/check_adapters.sh build/IronPet.app

      - name: Check scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/e2e.py scripts/gen_agent_catalog.py
